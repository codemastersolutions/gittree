name: Release (CLI + Core → npm)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump override (skip conventional-commits auto-detect)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - major
          - minor
          - patch
          - prerelease
      tag-prefix:
        description: 'Prefixo da tag (padrão: v)'
        required: false
        default: 'v'
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'
  PNPM_VERSION: '12.3.4'
  DEFAULT_TAG_PREFIX: 'v'

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # GUARD: Garante que SOMENTE executa o release se os required checks
  # do último commit na branch main PASSARAM.
  #
  # Serve como camada adicional mesmo que Branch Protection Rules
  # (12 checks) sejam bypassados/force-push acidental.
  # ─────────────────────────────────────────────────────────────────────
  preflight-required-checks:
    name: Guard · Required Checks (last commit HEAD on main)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      statuses: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait & verify CI check-suites passed on HEAD commit
        id: checks
        uses: poseidon/wait-for-status-checks@v0.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: |
            Release (CLI + Core → npm)
            pages-build-deployment
          timeout-seconds: 900
          expected-conclusions: success,neutral,skipped

      - name: Summary guard
        shell: bash
        run: |
          echo "✅ Todos os required checks do commit $(git rev-parse --short HEAD) na branch main PASSARAM."
          echo "Release workflow autorizado a prosseguir."

  # ─────────────────────────────────────────────────────────────────────
  # RELEASE PRINCIPAL
  # ─────────────────────────────────────────────────────────────────────
  release-publish:
    name: Release · Bump + Tag + Publish (npm Provenance SLSA L3)
    needs: [preflight-required-checks]
    runs-on: ubuntu-latest

    # 🔑 PERMISSÕES OBRIGATÓRIAS PARA NPM PROVENANCE + GIT TAG
    permissions:
      id-token: write
      contents: write
      attestations: write
      packages: write

    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@codemastersolutions/gittree-cli

    steps:
      - name: Checkout repository (full history · conventional commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Corepack · enable + prepare pnpm (ANTES de setup-node)
        shell: bash
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          command -v pnpm
          pnpm --version

      - name: Setup Node.js ${{ env.NODE_VERSION }} + cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Post setup-node · sanity check node + pnpm
        shell: bash
        run: |
          node --version
          command -v pnpm
          pnpm --version

      - name: Install dependencies (frozen lockfile)
        shell: bash
        run: |
          pnpm install --frozen-lockfile --prefer-offline

      - name: Configure release bot (git user/email)
        shell: bash
        run: |
          git config user.name  "GitTree Release Bot"
          git config user.email "release-bot@codemastersolutions.com.br"

      - name: (Workflow Dispatch) Detect bump override
        id: bump
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.bump }}" ]]; then
            echo "override=${{ github.event.inputs.bump }}" >> "$GITHUB_OUTPUT"
            echo "manual=1" >> "$GITHUB_OUTPUT"
            echo "Overriding semver detection -> ${{ github.event.inputs.bump }}"
          else
            echo "override=" >> "$GITHUB_OUTPUT"
            echo "manual=0" >> "$GITHUB_OUTPUT"
            echo "Auto semver via conventional-commits."
          fi

      - name: 1/8 · Dry-run detect next version
        id: next-version
        shell: bash
        env:
          BUMP_OVERRIDE: ${{ steps.bump.outputs.override }}
          TAG_PREFIX: ${{ github.event.inputs.tag-prefix || env.DEFAULT_TAG_PREFIX }}
        run: |
          set -euo pipefail
          pnpm dlx commit-and-tag-version@12 \
            --dry-run \
            --tag-prefix "$TAG_PREFIX" \
            ${BUMP_OVERRIDE:+--release-as "$BUMP_OVERRIDE"} \
            --skip.commit --skip.tag --skip.changelog \
            > /tmp/cttv-dryrun.log 2>&1 || cat /tmp/cttv-dryrun.log

          NEXT="$(awk '/^tagging release/ {gsub("'"$TAG_PREFIX"'",""); print $NF}' /tmp/cttv-dryrun.log | head -n1 || true)"
          if [[ -z "$NEXT" ]]; then
            NEXT="$(node -e "console.log(require('./package.json').version)")"
            echo "⚠️  Sem alterações release-worthy detectadas; mantendo versão atual: $NEXT"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_PREFIX}${NEXT}" >> "$GITHUB_OUTPUT"
          cat /tmp/cttv-dryrun.log

      - name: 2/8 · Bump version + CHANGELOG (commit-and-tag-version)
        if: steps.next-version.outputs.skip == 0
        shell: bash
        env:
          BUMP_OVERRIDE: ${{ steps.bump.outputs.override }}
          TAG_PREFIX: ${{ github.event.inputs.tag-prefix || env.DEFAULT_TAG_PREFIX }}
        run: |
          set -euo pipefail

          pnpm dlx commit-and-tag-version@12 \
            --tag-prefix "$TAG_PREFIX" \
            ${BUMP_OVERRIDE:+--release-as "$BUMP_OVERRIDE"} \
            --commitAll \
            -a

          NEW_VERSION="$(node -e "console.log(require('./package.json').version)")"
          echo "Sincronizando ROOT version=$NEW_VERSION → CLI, CORE, VSCODE..."

          for p in packages/cli packages/core packages/vscode; do
            node -e "
              const fs = require('fs');
              const f  = '$p/package.json';
              const pkg = JSON.parse(fs.readFileSync(f,'utf8'));
              pkg.version = '$NEW_VERSION';
              if (p !== 'packages/vscode') {
                pkg.packageManager = require('./package.json').packageManager;
                pkg.engines = pkg.engines || {};
                pkg.engines.node = '>=22.0.0';
              }
              fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + '\n');
            "
          done

          git add packages/*/package.json
          git commit --amend --no-edit

          TAG="${TAG_PREFIX}${NEW_VERSION}"
          git tag -f "$TAG"
          echo "Nova release: $TAG"

      - name: 3/8 · Push release commit + tag para origin/main
        if: steps.next-version.outputs.skip == 0
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW_VERSION="$(node -e "console.log(require('./package.json').version)")"
          TAG="${{ github.event.inputs.tag-prefix || env.DEFAULT_TAG_PREFIX }}${NEW_VERSION}"

          git push origin main
          git push origin "$TAG"

          echo "VERSION=$NEW_VERSION"        >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG"            >> "$GITHUB_ENV"

          {
            echo "## 🚀 Release \`$TAG\` created"
            echo
            echo "- \`@codemastersolutions/gittree-core\` · \`$NEW_VERSION\`"
            echo "- \`@codemastersolutions/gittree-cli\` · \`$NEW_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 4/8 · Build CLI + Core
        if: steps.next-version.outputs.skip == 0
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @codemastersolutions/gittree-core run build
          pnpm --filter @codemastersolutions/gittree-cli  run build
          pnpm typecheck
          pnpm lint

      - name: 5/8 · Unit tests + 90% coverage gate (layer1 vitest thresholds + layer2 script)
        if: steps.next-version.outputs.skip == 0
        shell: bash
        run: |
          set -euo pipefail
          pnpm test:coverage
          node scripts/check-coverage.mjs

      - name: 6/8 · Publish @codemastersolutions/gittree-core · npm provenance
        if: steps.next-version.outputs.skip == 0
        shell: bash
        env:
          # Required for npm provenance (OIDC · SLSA L3 · Trusted Publisher)
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail
          PKG="@codemastersolutions/gittree-core"
          VERSION="$VERSION"
          if npm view "$PKG@$VERSION" version 2>/dev/null | grep -qF "$VERSION"; then
            echo "🟡 $PKG@$VERSION já publicado no npm; skip."
          else
            (
              cd packages/core
              pnpm publish \
                --access public \
                --provenance \
                --no-git-checks \
                --tag latest \
                --report-summary
            )
            echo "✅ $PKG@$VERSION publicado (provenance ativo)."
          fi

      - name: 7/8 · Publish @codemastersolutions/gittree-cli · npm provenance
        if: steps.next-version.outputs.skip == 0
        shell: bash
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail
          PKG="@codemastersolutions/gittree-cli"
          VERSION="$VERSION"
          if npm view "$PKG@$VERSION" version 2>/dev/null | grep -qF "$VERSION"; then
            echo "🟡 $PKG@$VERSION já publicado no npm; skip."
          else
            # Sleep intencional para o npm registry propagar o core recém-publicado
            sleep 15
            (
              cd packages/cli
              pnpm publish \
                --access public \
                --provenance \
                --no-git-checks \
                --tag latest \
                --report-summary
            )
            echo "✅ $PKG@$VERSION publicado (provenance ativo)."
          fi

      - name: 8/8 · GitHub Release (notes + CHANGELOG.md)
        if: steps.next-version.outputs.skip == 0
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            CHANGELOG.md

      - name: Skip · sem alterações release-worthy
        if: steps.next-version.outputs.skip == 1
        shell: bash
        run: |
          echo "Nenhuma alteração release-worthy desde a última tag;"
          echo "nada para publicar. Release abortado com sucesso."
          echo "## 🟡 Skip · nada para publicar" >> "$GITHUB_STEP_SUMMARY"
