name: CI

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (with pnpm via corepack)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Enable corepack and align pnpm version
        run: |
          corepack enable
          corepack install --global pnpm@$(node -e "console.log(require('./package.json').packageManager.split('@')[1])")
          pnpm --version

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Commitlint (PR title)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm dlx @codemastersolutions/commitzero lint -m "$PR_TITLE" || { echo "::warning::PR title does not follow conventional commits"; true; }

  test-core-cli:
    name: Unit Tests (core + cli + vscode)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (with pnpm via corepack)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Enable corepack and align pnpm version
        run: |
          corepack enable
          corepack install --global pnpm@$(node -e "console.log(require('./package.json').packageManager.split('@')[1])")
          pnpm --version

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Enforce 90% coverage
        run: |
          node -e "
            const c = require('./coverage/coverage-summary.json');
            const total = c.total;
            const checks = [
              ['lines', total.lines.pct],
              ['functions', total.functions.pct],
              ['branches', total.branches.pct],
              ['statements', total.statements.pct],
            ];
            let ok = true;
            for (const [k, v] of checks) {
              console.log(k + ': ' + v + '%');
              if (Number(v) < 90) ok = false;
            }
            if (!ok) { console.error('Coverage below 90% threshold'); process.exit(1); }
            console.log('Coverage OK');
          "

  integration:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    needs: test-core-cli
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['18.x', '20.x']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }} (with pnpm via corepack)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Enable corepack and align pnpm version
        run: |
          corepack enable
          corepack install --global pnpm@$(node -e "console.log(require('./package.json').packageManager.split('@')[1])")
          pnpm --version

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Ensure git config
        run: |
          git config --global user.name "GitTree CI"
          git config --global user.email "ci@gittree.dev"
          git config --global init.defaultBranch main

      - name: Run integration tests
        run: pnpm test:integration

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: test-core-cli
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (with pnpm via corepack)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Enable corepack and align pnpm version
        run: |
          corepack enable
          corepack install --global pnpm@$(node -e "console.log(require('./package.json').packageManager.split('@')[1])")
          pnpm --version

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build all packages
        run: pnpm build

      - name: Upload CLI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-build
          path: packages/cli/dist/
          retention-days: 14

      - name: Upload core build artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-build
          path: packages/core/dist/
          retention-days: 14

      - name: Package VS Code extension
        run: |
          cd packages/vscode
          pnpm dlx @vscode/vsce package --no-git-tag-version --out ../../dist/gittree.vsix --no-yarn --allow-missing-repository || echo "vsce package skipped (may require marketplace credentials for non-release)"

      - name: Upload VSIX artifact (if available)
        if: hashFiles('dist/gittree.vsix') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gittree-vsix
          path: dist/gittree.vsix
          retention-days: 30

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (with pnpm via corepack)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Enable corepack and align pnpm version
        run: |
          corepack enable
          corepack install --global pnpm@$(node -e "console.log(require('./package.json').packageManager.split('@')[1])")
          pnpm --version

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: pnpm audit (production)
        run: |
          pnpm audit --prod --audit-level high || {
            echo "::warning::pnpm audit found issues";
            pnpm audit --prod;
            exit 1;
          }
